name: "🐛 Bug report"
description: "Report a reproducible defect"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and safe input
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
  - type: input
    id: os
    attributes:
      label: OS and version
  - type: textarea
    id: output
    attributes:
      label: Compiler/runtime output
