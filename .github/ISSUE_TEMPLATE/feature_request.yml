name: "✨ Feature request"
description: "Suggest a scoped chatbot improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Example input and expected output
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: Compiler and OS impact
