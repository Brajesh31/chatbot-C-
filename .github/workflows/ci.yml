name: C build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler and make
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Record toolchain versions
        run: |
          cc --version
          make --version
          python3 --version
      - name: Build, test and validate documentation
        run: make check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and test with MinGW
        shell: pwsh
        run: |
          gcc --version
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror chatbot/chatbot.c -o chatbot-ci.exe
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror tests/test_chatbot.c -o chatbot-tests.exe
          .\chatbot-tests.exe
          pwsh -NoProfile -File tests/test_interactive.ps1 -AppPath ".\chatbot-ci.exe"
