name: Source release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build from
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Build and test
        run: |
          make test
          make
      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-linux-${{ inputs.tag }}
          path: build/chatbot
          if-no-files-found: error
