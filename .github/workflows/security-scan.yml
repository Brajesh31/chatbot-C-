name: C security and static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  gcc-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC and Make
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Run repository secret-pattern check
        run: sh scripts/security-check.sh
      - name: Run project tests
        run: make test
      - name: Run GCC static analyzer
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fanalyzer chatbot/chatbot.c -o /tmp/chatbot-analyzed
