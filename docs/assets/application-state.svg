<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Application state diagram</title><desc id="desc">States include startup, waiting, read, normalize, classify, respond, retry on long input, and exit on bye or EOF.</desc><rect width="900" height="360" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a"><rect x="40" y="130" width="120" height="60" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="100" y="166">Start</text><rect x="220" y="130" width="140" height="60" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="290" y="166">Read line</text><rect x="420" y="130" width="140" height="60" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="490" y="166">Normalize</text><rect x="620" y="130" width="130" height="60" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="685" y="166">Respond</text><rect x="390" y="265" width="170" height="55" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="475" y="298">Exit</text><rect x="220" y="265" width="140" height="55" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="290" y="298">Warn / retry</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M160 160h60m-12-9 12 9-12 9"/><path d="M360 160h60m-12-9 12 9-12 9"/><path d="M560 160h60m-12-9 12 9-12 9"/><path d="M290 190v75"/><path d="M685 190v102h-125"/><path d="M290 265v-75"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#475569"><text x="305" y="225">overlong</text><text x="700" y="240">exact bye</text><text x="475" y="345" text-anchor="middle">EOF also exits from read</text></g></svg>