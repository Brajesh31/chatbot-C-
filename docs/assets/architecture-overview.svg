<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">Chatbot architecture overview</title><desc id="desc">A pipeline from terminal input through bounded reader, normalizer, rule classifier, response mapper, and terminal output.</desc><rect width="1100" height="300" rx="22" fill="#f4f7fb"/><g font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#102033"><rect x="25" y="100" width="145" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="97" y="140">Terminal</text><text x="97" y="166">input</text><rect x="210" y="100" width="155" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="287" y="140">Bounded</text><text x="287" y="166">reader</text><rect x="405" y="100" width="145" height="90" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="477" y="140">Normalize</text><text x="477" y="166">case</text><rect x="590" y="100" width="145" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="662" y="140">Classify</text><text x="662" y="166">rules</text><rect x="775" y="100" width="145" height="90" rx="16" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="847" y="140">Response</text><text x="847" y="166">mapper</text><rect x="960" y="100" width="115" height="90" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="1017" y="140">Terminal</text><text x="1017" y="166">output</text></g><g stroke="#475569" stroke-width="4" fill="none"><path d="M170 145h40m-12 -10 12 10-12 10"/><path d="M365 145h40m-12 -10 12 10-12 10"/><path d="M550 145h40m-12 -10 12 10-12 10"/><path d="M735 145h40m-12 -10 12 10-12 10"/><path d="M920 145h40m-12 -10 12 10-12 10"/></g><text x="550" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">No network service • no database • no persistent conversation history</text></svg>