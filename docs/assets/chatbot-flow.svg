<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">C chatbot input flow</title><desc id="desc">The program prompts, reads a bounded line, handles EOF or overlong input, normalizes accepted text, classifies the message, prints a response, and exits only on exact bye.</desc><rect width="1000" height="290" rx="18" fill="#f5f7fb"/><g font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#17243a" stroke="#52657d" stroke-width="1.5"><rect x="22" y="90" width="130" height="65" rx="10" fill="#e0e7ff"/><rect x="190" y="90" width="130" height="65" rx="10" fill="#e0e7ff"/><rect x="358" y="90" width="130" height="65" rx="10" fill="#dbeafe"/><rect x="526" y="90" width="130" height="65" rx="10" fill="#dbeafe"/><rect x="694" y="90" width="130" height="65" rx="10" fill="#dcfce7"/><rect x="862" y="90" width="116" height="65" rx="10" fill="#fef3c7"/><g stroke="none"><text x="87" y="128">Prompt</text><text x="255" y="128">Read line</text><text x="423" y="128">Validate</text><text x="591" y="128">Normalize</text><text x="759" y="128">Classify</text><text x="920" y="128">Respond</text></g><g fill="none"><path d="M152 122h36m-8 -6l8 6l-8 6"/><path d="M320 122h36m-8 -6l8 6l-8 6"/><path d="M488 122h36m-8 -6l8 6l-8 6"/><path d="M656 122h36m-8 -6l8 6l-8 6"/><path d="M824 122h36m-8 -6l8 6l-8 6"/></g><text x="500" y="220" stroke="none" fill="#7c2d12">EOF exits cleanly • Long input is discarded • Exact “bye” exits</text></g></svg>