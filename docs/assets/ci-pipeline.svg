<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Continuous integration workflow</title><desc id="desc">Push and pull requests run platform builds, C tests, documentation validation, and security static analysis.</desc><rect width="1000" height="300" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a"><rect x="35" y="110" width="150" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110" y="151">Push / PR</text><rect x="265" y="35" width="190" height="65" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="360" y="74">Linux build + tests</text><rect x="265" y="118" width="190" height="65" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="360" y="157">Windows compile + tests</text><rect x="265" y="201" width="190" height="65" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="360" y="240">Docs + SVG validation</text><rect x="565" y="110" width="190" height="70" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="660" y="151">Static analysis</text><rect x="825" y="110" width="140" height="70" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="895" y="151">Review result</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M185 145h55m-12-9 12 9-12 9"/><path d="M455 68h48v77h62m-12-9 12 9-12 9"/><path d="M455 150h110"/><path d="M455 233h48v-88h62m-12-9 12 9-12 9"/><path d="M755 145h70m-12-9 12 9-12 9"/></g></svg>