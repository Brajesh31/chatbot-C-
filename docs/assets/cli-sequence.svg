<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">Terminal conversation sequence</title><desc id="desc">Illustrative terminal transcript: the user types hello, receives a greeting, types bye, receives goodbye, and the process exits.</desc><rect width="1000" height="380" rx="20" fill="#0f172a"/><rect x="35" y="30" width="930" height="320" rx="15" fill="#111f34" stroke="#48617c" stroke-width="2"/><circle cx="68" cy="58" r="8" fill="#fb7185"/><circle cx="94" cy="58" r="8" fill="#fbbf24"/><circle cx="120" cy="58" r="8" fill="#34d399"/><g font-family="monospace" font-size="22"><text x="75" y="112" fill="#7dd3fc">$ ./build/chatbot</text><text x="75" y="153" fill="#f8fafc">Chatbot: Hi! I'm a simple chatbot. Type 'bye' to exit.</text><text x="75" y="195" fill="#a7f3d0">You: hello</text><text x="75" y="232" fill="#f8fafc">Chatbot: Hello! How can I help you today?</text><text x="75" y="274" fill="#a7f3d0">You: bye</text><text x="75" y="311" fill="#f8fafc">Chatbot: Goodbye! Have a great day!</text></g></svg>