<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc"><title id="title">Data flow diagram level zero</title><desc id="desc">A terminal user sends a line to the Simple C Chatbot process and receives a prompt or fixed response. No external data store or service participates.</desc><rect width="800" height="260" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a"><rect x="45" y="90" width="180" height="80" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="135" y="137">Terminal user</text><ellipse cx="405" cy="130" rx="145" ry="70" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="405" y="122">Simple C</text><text x="405" y="149">Chatbot process</text><rect x="575" y="90" width="180" height="80" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="665" y="137">Terminal output</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M225 112h35l0 0h0m-12-9 12 9-12 9"/><path d="M550 112h25m-12-9 12 9-12 9"/><path d="M575 148h-25m12-9-12 9 12 9"/><path d="M260 148h-35m12-9-12 9 12 9"/></g><text x="400" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">One local process, transient input, fixed response.</text></svg>