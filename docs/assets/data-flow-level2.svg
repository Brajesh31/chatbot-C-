<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">Data flow diagram level two</title><desc id="desc">Detailed processing steps show stdin flowing through fgets, newline and length checks, drain behavior, lowercase normalization, greeting/status/bye/fallback classification, response mapping, and stdout.</desc><rect width="1100" height="350" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#0f172a"><rect x="20" y="135" width="105" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="72" y="176">stdin</text><rect x="155" y="135" width="130" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="220" y="164">fgets</text><text x="220" y="186">bounded</text><rect x="315" y="135" width="130" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="380" y="164">length and</text><text x="380" y="186">newline check</text><rect x="475" y="35" width="145" height="70" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="547" y="64">Drain and</text><text x="547" y="86">warn</text><rect x="475" y="135" width="145" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="547" y="164">Lowercase</text><text x="547" y="186">normalization</text><rect x="650" y="135" width="145" height="70" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="722" y="164">Ordered</text><text x="722" y="186">rule checks</text><rect x="825" y="135" width="130" height="70" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="890" y="164">Response</text><text x="890" y="186">mapping</text><rect x="985" y="135" width="95" height="70" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="1032" y="176">stdout</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M125 170h30m-12-9 12 9-12 9"/><path d="M285 170h30m-12-9 12 9-12 9"/><path d="M445 170h30m-12-9 12 9-12 9"/><path d="M620 170h30m-12-9 12 9-12 9"/><path d="M795 170h30m-12-9 12 9-12 9"/><path d="M955 170h30m-12-9 12 9-12 9"/><path d="M380 135V70h95m-12-9 12 9-12 9"/></g><text x="722" y="245" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569">Greeting → status → exact bye → fallback</text><text x="547" y="300" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#b45309">EOF or read error exits without classification</text></svg>