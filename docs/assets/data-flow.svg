<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Chatbot data flow diagram</title><desc id="desc">User line enters the process, is bounded and normalized, classified, mapped to static text, and sent to standard output. Long lines are rejected and EOF terminates.</desc><rect width="1000" height="320" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#0f172a" font-size="18"><rect x="30" y="95" width="145" height="75" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="102" y="139">stdin bytes</text><rect x="220" y="95" width="155" height="75" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="297" y="139">Bounded read</text><rect x="420" y="95" width="150" height="75" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="495" y="139">Normalize</text><rect x="615" y="95" width="145" height="75" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="687" y="139">Classify</text><rect x="805" y="95" width="160" height="75" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="885" y="139">Static response</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M175 132h45m-12-9 12 9-12 9"/><path d="M375 132h45m-12-9 12 9-12 9"/><path d="M570 132h45m-12-9 12 9-12 9"/><path d="M760 132h45m-12-9 12 9-12 9"/></g><path d="M298 170v65h210" fill="none" stroke="#dc2626" stroke-width="3"/><text x="510" y="242" font-family="Arial,sans-serif" font-size="16" fill="#b91c1c">Overlong line: drain remainder, warn, retry</text><path d="M295 95V48h-90" fill="none" stroke="#64748b" stroke-width="2"/><text x="120" y="42" font-family="Arial,sans-serif" font-size="16" fill="#475569">EOF or input error: exit</text></svg>