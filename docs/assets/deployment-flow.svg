<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Source distribution flow</title><desc id="desc">Reviewed source tag is checked out, compiled, tested, packaged as a platform-specific executable, and verified by the user.</desc><rect width="1000" height="300" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="18" fill="#0f172a"><rect x="25" y="100" width="150" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="100" y="145">Source tag</text><rect x="220" y="100" width="150" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="295" y="145">Compile</text><rect x="415" y="100" width="150" height="80" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="490" y="145">Test</text><rect x="610" y="100" width="150" height="80" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="685" y="145">Package</text><rect x="805" y="100" width="165" height="80" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="887" y="145">User verifies</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M175 140h45m-12-9 12 9-12 9"/><path d="M370 140h45m-12-9 12 9-12 9"/><path d="M565 140h45m-12-9 12 9-12 9"/><path d="M760 140h45m-12-9 12 9-12 9"/></g><text x="500" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Local executable distribution only. No hosted deployment or automatic GitHub Release.</text></svg>