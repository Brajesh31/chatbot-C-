<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" role="img" aria-labelledby="title desc"><title id="title">Input error handling flow</title><desc id="desc">The input reader distinguishes valid lines, EOF or input errors, and overlong lines. Valid lines continue to normalization. EOF exits. Overlong lines are drained, warned, and retried.</desc><rect width="950" height="360" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><rect x="40" y="130" width="160" height="75" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120" y="174">Read input</text><rect x="310" y="35" width="180" height="75" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="400" y="79">Valid line</text><rect x="310" y="142" width="180" height="75" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="400" y="186">EOF / error</text><rect x="310" y="250" width="180" height="75" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="400" y="294">Overlong line</text><rect x="610" y="35" width="280" height="75" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="750" y="79">Normalize and classify</text><rect x="610" y="142" width="280" height="75" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="750" y="186">Clean exit</text><rect x="610" y="250" width="280" height="75" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="750" y="294">Drain, warn and retry</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M200 167L310 72m-13 4 13-4-2 13"/><path d="M200 167h110m-12-9 12 9-12 9"/><path d="M200 167L310 287m-13-4 13 4-2-13"/><path d="M490 72h120m-12-9 12 9-12 9"/><path d="M490 180h120m-12-9 12 9-12 9"/><path d="M490 287h120m-12-9 12 9-12 9"/></g></svg>