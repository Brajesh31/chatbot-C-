<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Bounded input boundary</title><desc id="desc">A 256-byte buffer accepts at most 255 bytes plus a NUL terminator. Accepted input continues, overlong input is drained and rejected, and EOF exits.</desc>
<rect width="1100" height="570" rx="24" fill="#f8fafc"/><text x="60" y="62" fill="#0f172a" font-family="sans-serif" font-size="30" font-weight="700">Bounded input contract</text>
<rect x="70" y="110" width="270" height="115" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="205" y="150" text-anchor="middle" fill="#075985" font-family="sans-serif" font-size="22" font-weight="700">stdin</text><text x="205" y="184" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="17">One logical line</text><path d="M340 167H420" stroke="#334155" stroke-width="4"/><path d="M408 155L420 167L408 179" stroke="#334155" stroke-width="4" fill="none"/>
<rect x="420" y="105" width="280" height="125" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="560" y="145" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="22" font-weight="700">char buffer[256]</text><text x="560" y="181" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="18">255 bytes + NUL</text><path d="M700 167H790V120H835" stroke="#334155" stroke-width="4" fill="none"/><path d="M823 108L835 120L823 132" stroke="#334155" stroke-width="4" fill="none"/>
<rect x="835" y="76" width="205" height="98" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="937" y="114" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="20" font-weight="700">Accepted</text><text x="937" y="144" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="17">Normalize → rules</text><path d="M700 185H790V300H835" stroke="#334155" stroke-width="4" fill="none"/><path d="M823 288L835 300L823 312" stroke="#334155" stroke-width="4" fill="none"/>
<rect x="835" y="255" width="205" height="98" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="937" y="294" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="20" font-weight="700">Overlong</text><text x="937" y="324" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="17">Drain + reject</text><path d="M205 225V420H420" stroke="#334155" stroke-width="4" fill="none"/><path d="M408 408L420 420L408 432" stroke="#334155" stroke-width="4" fill="none"/>
<rect x="420" y="380" width="280" height="95" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="560" y="418" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="21" font-weight="700">EOF / read error</text><text x="560" y="448" text-anchor="middle" fill="#7f1d1d" font-family="sans-serif" font-size="17">Exit without classifying</text><text x="70" y="525" fill="#475569" font-family="sans-serif" font-size="17">An overlong physical line is one rejected turn, not multiple partial messages.</text></svg>