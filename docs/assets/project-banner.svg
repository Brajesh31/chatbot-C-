<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Simple C Chatbot project banner</title><desc id="desc">Dark terminal-inspired banner for a deterministic C command-line chatbot, with a terminal prompt icon and feature labels.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172b46"/></linearGradient><linearGradient id="accent"><stop stop-color="#41dcc4"/><stop offset="1" stop-color="#6685ff"/></linearGradient></defs><rect width="1200" height="360" rx="30" fill="url(#bg)"/><circle cx="1040" cy="30" r="180" fill="#4165c8" opacity=".12"/><circle cx="1130" cy="315" r="190" fill="#40d2b5" opacity=".10"/><rect x="55" y="70" width="220" height="220" rx="42" fill="#0a1220" stroke="url(#accent)" stroke-width="7"/><path d="M105 135l54 45-54 45" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M178 225h55" stroke="#41dcc4" stroke-width="17" stroke-linecap="round"/><text x="330" y="145" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#f8fafc">Simple C Chatbot</text><text x="334" y="200" font-family="Arial,sans-serif" font-size="27" fill="#b8c7df">A deterministic terminal chatbot, built with standard C</text><rect x="334" y="238" width="185" height="42" rx="21" fill="#193e4b" stroke="#41dcc4"/><text x="426" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#c8fff4">C11 • CLI</text><rect x="535" y="238" width="190" height="42" rx="21" fill="#1e2f58" stroke="#6685ff"/><text x="630" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dbe4ff">No AI / no API</text><rect x="741" y="238" width="188" height="42" rx="21" fill="#263247" stroke="#7890ad"/><text x="835" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e1eaf5">Tests included</text></svg>