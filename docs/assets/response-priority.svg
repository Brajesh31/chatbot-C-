<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc"><title id="title">Response rule priority</title><desc id="desc">Normalized input checks hello, then how are you, then exact bye, then fallback.</desc><rect width="880" height="300" rx="18" fill="#f7f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="15"><rect x="280" y="22" width="320" height="50" rx="10" fill="#e0e7ff" stroke="#4f46e5"/><text x="440" y="53">Normalized input</text><path d="M440 72v30" stroke="#64748b"/><rect x="305" y="102" width="270" height="46" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="440" y="131">Contains hello?</text><path d="M440 148v24M440 172H180v16M440 172H700v16" fill="none" stroke="#64748b"/><rect x="45" y="188" width="270" height="46" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="180" y="217">Greeting response</text><rect x="565" y="188" width="270" height="46" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="700" y="217">Check status, exact bye, fallback</text></g></svg>