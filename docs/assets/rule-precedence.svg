<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Chatbot rule precedence</title><desc id="desc">Classifier tests for hello first, how are you second, exact bye third, and fallback otherwise.</desc>
<rect width="1100" height="560" rx="24" fill="#f8fafc"/><text x="60" y="62" fill="#0f172a" font-family="sans-serif" font-size="30" font-weight="700">Ordered response rules</text><rect x="390" y="92" width="320" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="550" y="135" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="22" font-weight="700">Normalized input</text><path d="M550 162V195" stroke="#334155" stroke-width="4"/>
<rect x="370" y="195" width="360" height="78" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="550" y="228" text-anchor="middle" fill="#075985" font-family="sans-serif" font-size="21" font-weight="700">Contains "hello"?</text><text x="550" y="253" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="16">Priority 1</text><path d="M370 234H165V290" stroke="#16a34a" stroke-width="4" fill="none"/><text x="250" y="220" fill="#166534" font-family="sans-serif" font-size="17">Yes</text><rect x="65" y="290" width="200" height="74" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="165" y="334" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="20" font-weight="700">Greeting</text><path d="M730 234H930V290" stroke="#64748b" stroke-width="4" fill="none"/><text x="824" y="220" fill="#475569" font-family="sans-serif" font-size="17">No</text><rect x="750" y="290" width="300" height="78" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="900" y="323" text-anchor="middle" fill="#075985" font-family="sans-serif" font-size="20" font-weight="700">Contains "how are you"?</text><text x="900" y="348" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="16">Priority 2</text><path d="M900 368V405" stroke="#16a34a" stroke-width="4"/><rect x="790" y="405" width="220" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="900" y="444" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="20" font-weight="700">Status reply</text><text x="60" y="410" fill="#475569" font-family="sans-serif" font-size="17">Otherwise, exact "bye" exits; all other input gets fallback.</text><text x="60" y="452" fill="#475569" font-family="sans-serif" font-size="17">A line containing hello and bye gets greeting because it is checked first.</text><text x="60" y="520" fill="#64748b" font-family="sans-serif" font-size="15">Conceptual rule-order illustration; C source is authoritative.</text></svg>