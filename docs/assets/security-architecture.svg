<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Security architecture and trust boundaries</title><desc id="desc">Untrusted user input is bounded and processed inside a local process. Static output goes to the terminal. Repository CI separately checks source code. There is no network or persistence boundary.</desc><rect width="1000" height="340" rx="22" fill="#f8fafc"/><rect x="225" y="45" width="550" height="215" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 6"/><text x="500" y="75" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#1d4ed8">Local process boundary</text><g font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><rect x="25" y="130" width="150" height="75" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="100" y="174">Untrusted input</text><rect x="260" y="130" width="145" height="75" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="332" y="174">Bounded read</text><rect x="450" y="130" width="145" height="75" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="522" y="174">Rule checks</text><rect x="640" y="130" width="115" height="75" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="697" y="174">stdout</text><rect x="820" y="130" width="150" height="75" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="895" y="174">Terminal</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M175 167h85m-12-9 12 9-12 9"/><path d="M405 167h45m-12-9 12 9-12 9"/><path d="M595 167h45m-12-9 12 9-12 9"/><path d="M755 167h65m-12-9 12 9-12 9"/></g><text x="500" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">No user accounts • no API • no database • no runtime secrets</text></svg>