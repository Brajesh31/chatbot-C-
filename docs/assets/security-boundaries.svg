<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc"><title id="title">Chatbot security boundaries</title><desc id="desc">Untrusted terminal input crosses a bounded input boundary, is processed locally, and is written to terminal output. There is no network or persistent store.</desc><rect width="980" height="300" rx="20" fill="#f8fafc"/><rect x="220" y="38" width="540" height="220" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 6"/><text x="490" y="66" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e40af">Local process boundary</text><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a"><rect x="25" y="115" width="150" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="100" y="155">Untrusted input</text><rect x="260" y="115" width="150" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="335" y="155">Bounded read</text><rect x="440" y="115" width="145" height="70" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="512" y="155">Rule engine</text><rect x="615" y="115" width="120" height="70" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="675" y="155">stdout</text><rect x="800" y="115" width="155" height="70" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="877" y="155">Terminal</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M175 150h85m-12-9 12 9-12 9"/><path d="M410 150h30m-12-9 12 9-12 9"/><path d="M585 150h30m-12-9 12 9-12 9"/><path d="M735 150h65m-12-9 12 9-12 9"/></g><text x="490" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">No network, authentication, persistence, secrets, or external data store in the current runtime.</text></svg>