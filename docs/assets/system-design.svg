<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Simple C Chatbot system design</title><desc id="desc">System boundary shows a terminal user providing standard input to one local process, which reads, normalizes, classifies, and writes fixed response text to standard output. The process has no database or network service.</desc><rect width="1100" height="420" rx="24" fill="#f8fafc"/><rect x="210" y="38" width="680" height="330" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 6"/><text x="550" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1d4ed8">Local C11 process boundary</text><g font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><rect x="25" y="150" width="140" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="190">Terminal</text><text x="95" y="216">user</text><rect x="245" y="130" width="150" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="320" y="174">Bounded</text><text x="320" y="200">input</text><rect x="475" y="130" width="150" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="550" y="174">Rule</text><text x="550" y="200">engine</text><rect x="705" y="130" width="150" height="100" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="780" y="174">Static</text><text x="780" y="200">response</text><rect x="925" y="150" width="150" height="90" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="1000" y="190">Terminal</text><text x="1000" y="216">output</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M165 195h80m-12-9 12 9-12 9"/><path d="M395 180h80m-12-9 12 9-12 9"/><path d="M625 180h80m-12-9 12 9-12 9"/><path d="M855 195h70m-12-9 12 9-12 9"/></g><g font-family="Arial,sans-serif" font-size="16" fill="#475569"><text x="550" y="278" text-anchor="middle">No database • no network • no authentication • no persistent history</text><text x="550" y="314" text-anchor="middle">Build and quality checks run separately in repository CI</text></g></svg>