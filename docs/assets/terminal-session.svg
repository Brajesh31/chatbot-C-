<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Terminal conversation session</title><desc id="desc">Illustrative terminal window showing startup, hello greeting, and exact bye command with fixed goodbye response.</desc>
<rect width="1100" height="540" rx="24" fill="#0b1220"/><rect x="60" y="50" width="980" height="440" rx="18" fill="#111c2e" stroke="#334155" stroke-width="3"/><path d="M60 92H1040" stroke="#334155" stroke-width="3"/>
<circle cx="92" cy="72" r="8" fill="#fb7185"/><circle cx="120" cy="72" r="8" fill="#fbbf24"/><circle cx="148" cy="72" r="8" fill="#34d399"/>
<text x="185" y="79" fill="#cbd5e1" font-family="monospace" font-size="19">chatbot-C- · terminal session</text><text x="100" y="145" fill="#67e8f9" font-family="monospace" font-size="24">Chatbot: Hi! Type 'bye' to exit.</text><text x="100" y="205" fill="#e2e8f0" font-family="monospace" font-size="24">You: hello</text><text x="100" y="250" fill="#a7f3d0" font-family="monospace" font-size="24">Chatbot: Hello! How can I help you today?</text><text x="100" y="310" fill="#e2e8f0" font-family="monospace" font-size="24">You: bye</text><text x="100" y="355" fill="#a7f3d0" font-family="monospace" font-size="24">Chatbot: Goodbye! Have a great day!</text><text x="100" y="440" fill="#94a3b8" font-family="sans-serif" font-size="18">Illustrative transcript, not a captured screenshot.</text></svg>