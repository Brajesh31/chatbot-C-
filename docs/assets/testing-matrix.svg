<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Repository verification layers</title><desc id="desc">Five layers show unit tests, interactive tests, platform builds, documentation checks and static security analysis.</desc>
<rect width="1100" height="520" rx="24" fill="#0f172a"/><text x="60" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="30" font-weight="700">Verification layers</text><g font-family="sans-serif">
<rect x="70" y="105" width="960" height="62" rx="12" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="100" y="145" fill="#ecfeff" font-size="22" font-weight="700">1. Unit tests</text><text x="410" y="145" fill="#cffafe" font-size="18">Rules, normalization, exact exit and fallback</text>
<rect x="70" y="185" width="960" height="62" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="100" y="225" fill="#eff6ff" font-size="22" font-weight="700">2. Interactive tests</text><text x="410" y="225" fill="#dbeafe" font-size="18">stdin/stdout, long-line drain and EOF</text>
<rect x="70" y="265" width="960" height="62" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="100" y="305" fill="#f0fdf4" font-size="22" font-weight="700">3. Platform builds</text><text x="410" y="305" fill="#dcfce7" font-size="18">Linux full checks and Windows compile/unit tests</text>
<rect x="70" y="345" width="960" height="62" rx="12" fill="#713f12" stroke="#fbbf24" stroke-width="2"/><text x="100" y="385" fill="#fffbeb" font-size="22" font-weight="700">4. Documentation checks</text><text x="410" y="385" fill="#fef3c7" font-size="18">Markdown, local links, SVG and tracked tree</text>
<rect x="70" y="425" width="960" height="62" rx="12" fill="#581c87" stroke="#c084fc" stroke-width="2"/><text x="100" y="465" fill="#faf5ff" font-size="22" font-weight="700">5. Security analysis</text><text x="410" y="465" fill="#f3e8ff" font-size="18">Gitleaks, CodeQL, GCC analyzer and local hygiene</text></g></svg>