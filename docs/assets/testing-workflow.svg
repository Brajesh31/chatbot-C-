<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Testing workflow</title><desc id="desc">Source changes proceed through strict compilation, C unit tests, POSIX interactive tests, documentation validation, and security analysis.</desc><rect width="1000" height="330" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a"><rect x="25" y="110" width="135" height="75" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="92" y="153">Source</text><rect x="205" y="110" width="145" height="75" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="277" y="153">Strict build</text><rect x="395" y="110" width="145" height="75" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="467" y="153">Unit tests</text><rect x="585" y="110" width="145" height="75" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="657" y="153">Interactive</text><rect x="775" y="55" width="190" height="75" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="870" y="98">Docs validation</text><rect x="775" y="190" width="190" height="75" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="870" y="233">Static analysis</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M160 147h45m-12-9 12 9-12 9"/><path d="M350 147h45m-12-9 12 9-12 9"/><path d="M540 147h45m-12-9 12 9-12 9"/><path d="M730 147h25v-55h20m-12-9 12 9-12 9"/><path d="M730 147h25v80h20m-12-9 12 9-12 9"/></g><text x="500" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">A failed gate blocks the change until the underlying cause is fixed.</text></svg>