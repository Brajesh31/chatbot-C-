<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">Project contribution workflow</title><desc id="desc">Contributor reads scope, makes a focused change, adds tests, runs local checks, updates documentation, opens a pull request, and receives review.</desc><rect width="1000" height="350" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a"><rect x="30" y="105" width="145" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="102" y="139">Read scope</text><text x="102" y="162">and issue</text><rect x="220" y="105" width="145" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="292" y="139">Focused</text><text x="292" y="162">change</text><rect x="410" y="105" width="145" height="80" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="482" y="139">Add tests</text><text x="482" y="162">and docs</text><rect x="600" y="105" width="145" height="80" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="672" y="139">Run make</text><text x="672" y="162">check</text><rect x="790" y="105" width="175" height="80" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="877" y="139">Pull request</text><text x="877" y="162">and review</text></g><g stroke="#475569" stroke-width="3" fill="none"><path d="M175 145h45m-12-9 12 9-12 9"/><path d="M365 145h45m-12-9 12 9-12 9"/><path d="M555 145h45m-12-9 12 9-12 9"/><path d="M745 145h45m-12-9 12 9-12 9"/></g><text x="500" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">If a check fails, fix the change and rerun the checks before review.</text></svg>